<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080A">
<meta name="description" content="PaceMates helps you find a running club in Madrid that fits your pace, your neighborhood and your week.">
<title>PaceMates: find your running club</title>
<style>
:root{
  --bg:#07080A; --ink:#F2F4F7; --ink-2:#C9CED6; --muted:#8B93A1; --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.18);
  --sky-50:rgba(255,255,255,.045); --sky-100:rgba(93,182,236,.16); --sky-200:rgba(93,182,236,.30); --sky-300:rgba(93,182,236,.46);
  --sky-400:#5DB6EC; --sky-500:#5DB6EC; --sky-600:#5DB6EC; --sky-700:#7CC4F0;
  --red:#E5484D; --red-dark:#CF3A3F; --red-50:rgba(229,72,77,.14);
  --glass:rgba(255,255,255,.07); --glass-edge:rgba(255,255,255,.16);
  --radius:18px; --tabs:60px;
  --top:calc(env(safe-area-inset-top,0px) + 24px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{color-scheme:dark}
body{background:#0E1013;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1{font-size:25px;line-height:1.15;letter-spacing:-.025em;font-weight:600}
h2{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--sky-400);outline-offset:2px}

/* ---------- shell ---------- */
#app{position:relative;max-width:430px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:
  radial-gradient(120% 50% at 8% -8%,rgba(93,182,236,.30),transparent 60%),
  radial-gradient(90% 45% at 100% 108%,rgba(110,90,255,.22),transparent 60%),
  radial-gradient(60% 30% at 96% 42%,rgba(229,72,77,.08),transparent 70%),var(--bg)}
#screen{height:100%;overflow-y:auto;overflow-x:hidden;padding:var(--top) 20px 28px;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;scrollbar-width:none}
#screen::-webkit-scrollbar{display:none}
#screen>*{flex:none}
#screen:focus{outline:none}
.has-tabs #screen{padding-bottom:calc(var(--tabs) + 48px)}
@media(min-width:600px){
  body{padding:20px 0}
  #app{width:390px;max-width:none;height:min(844px,calc(100vh - 40px));border-radius:46px;border:1px solid rgba(255,255,255,.16);box-shadow:0 30px 80px rgba(0,0,0,.6)}
  #app::before{content:"";position:absolute;top:11px;left:50%;transform:translateX(-50%);width:92px;height:26px;border-radius:14px;background:#000;z-index:30}
  :root{--top:56px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- glass (used only on floating elements) ---------- */
.btn,.iconbtn,.search,.pill,#tabs,.bar,.stat,.kpi,.stats,#toast{
  background:var(--glass);border:1px solid var(--glass-edge);
  -webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.20),0 8px 24px rgba(0,0,0,.30)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .btn,.iconbtn,.search,.pill,#tabs,.bar,.stat,.kpi,.stats,#toast{background:rgba(30,34,40,.94)}
}

#tabs,.bar{background:rgba(16,18,22,.62)}
/* ---------- tab bar ---------- */
#tabs{position:absolute;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));height:var(--tabs);border-radius:30px;display:none;grid-template-columns:repeat(3,1fr);z-index:20}
.has-tabs #tabs{display:grid}
#tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;color:var(--muted);font-size:10.5px;font-weight:600;cursor:pointer}
#tabs button[aria-current=page]{color:var(--ink)}
#tabs svg{width:21px;height:21px}

/* ---------- primitives ---------- */
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted)}
.fine{font-size:12.5px;color:var(--muted)}
.eyebrow{font-size:13px;font-weight:500;color:var(--muted);margin-bottom:3px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;min-height:50px;padding:0 20px;border-radius:26px;color:var(--ink);font-size:15.5px;font-weight:600;cursor:pointer;text-decoration:none;transition:transform .12s,background .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-red{background:#F2F4F7;border-color:#F2F4F7;color:#0A0B0D;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.btn-red:hover{background:#fff}
.btn-ghost{background:transparent;border-color:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.btn-sm{min-height:42px;font-size:14px;width:auto;padding:0 18px}
.link{background:none;border:0;padding:6px 0;color:var(--sky-700);font-weight:600;font-size:14px;cursor:pointer}
.link.danger{color:#FF8A8F}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:2px;margin:0 0 12px -6px;padding:6px 8px 6px 2px;background:none;border:0;color:var(--ink-2);font-weight:500;font-size:14.5px;cursor:pointer}
.iconbtn{position:relative;flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:23px;color:var(--sky-700);cursor:pointer}
.iconbtn .count{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}

/* ---------- forms ---------- */
label.f{display:block;margin:20px 0 7px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field,select.field,textarea.field{width:100%;min-height:48px;padding:12px 15px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:16px;color:var(--ink)}
select.field option{background:#14171B;color:#F2F4F7}
.field::placeholder{color:#6B7380}
textarea.field{min-height:92px;resize:vertical}
.field:focus{outline:none;border-color:var(--sky-400);box-shadow:0 0 0 3px rgba(93,182,236,.22)}
.field[aria-invalid=true]{border-color:var(--red)}
input[type=range]{width:100%;accent-color:var(--sky-400);margin:6px 0}
input[type=range]:disabled{opacity:.4}
.err{min-height:22px;margin:12px 0 6px;font-size:13.5px;font-weight:600;color:#FF8A8F}
.hint{font-size:12.5px;color:var(--muted);margin-top:7px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:inline-block}
.chip input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.chip span{display:inline-block;padding:8px 14px;border-radius:15px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:13.5px;font-weight:500;color:var(--ink-2);transition:background .12s,border-color .12s}
.chip input:checked+span{background:var(--sky-100);border-color:var(--sky-300);color:#BFE3F8}
.chip input:focus-visible+span{outline:2px solid var(--sky-400);outline-offset:2px}
.chip input:disabled+span{opacity:.45}
.switch{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.switch input{width:22px;height:22px;accent-color:var(--sky-400)}
.pace-out{font-size:24px;font-weight:600;letter-spacing:-.02em;color:var(--ink);margin:4px 0}
.bar{position:sticky;bottom:-16px;margin:auto 0 0;padding:8px;border-radius:32px;display:flex;gap:8px;z-index:10}
.bar .btn{flex:1;min-height:46px;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(255,255,255,.08);border-color:transparent;width:auto}
.bar .btn-red{flex:1.4;background:#F2F4F7;color:#0A0B0D}
.bar .btn-ghost{flex:none;background:transparent;width:auto}

/* ---------- welcome ---------- */
.welcome{flex:1 0 auto!important;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 0 24px}
.logo{display:flex;justify-content:center;margin-bottom:18px}
.logo i{display:block;width:40px;height:40px;border-radius:50%}
.logo i:first-child{background:#F2F4F7}
.logo i:last-child{background:var(--red);margin-left:-15px}
.brand{font-size:34px;font-weight:600;letter-spacing:-.035em}
.tagline{margin-top:9px;font-size:16.5px;color:var(--muted)}
.welcome-body{display:flex;flex-direction:column;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-radius:22px;padding:15px 0;margin:0 0 10px}
.stats>div{text-align:center}
.stats>div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-size:23px;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.stats span{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

/* ---------- list ---------- */
.head{margin-bottom:16px}
.searchrow{display:flex;gap:9px}
.search{flex:1;display:flex;align-items:center;gap:9px;height:46px;padding:0 15px;border-radius:23px;color:var(--muted)}
.search:focus-within{border-color:var(--sky-400)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;color:var(--ink)}
.search input::placeholder{color:#6B7380}
.pills{display:flex;gap:7px;overflow-x:auto;padding:12px 20px 2px;margin:0 -20px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 9px 6px 13px;border-radius:17px;color:var(--sky-700);font-size:12.5px;font-weight:600;cursor:pointer}
.pill svg{width:13px;height:13px}
.resultbar{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 10px;font-size:12.5px;color:var(--muted);font-weight:500}
.sort select{border:0;background:none;font-weight:600;color:var(--sky-700);font-size:12.5px;cursor:pointer;padding:4px 0}
.sort select option{background:#14171B;color:#F2F4F7}
.club{display:block;margin-bottom:10px;padding:15px;border-radius:20px;background:rgba(255,255,255,.045);border:1px solid var(--line);cursor:pointer;transition:transform .12s,border-color .15s}
.club:hover{border-color:var(--line-2)}
.club:active{transform:scale(.99)}
.club h3{font-size:15.5px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.club .where{margin-top:3px;font-size:12.5px;color:var(--muted)}
.match{flex:none;font-size:13px;font-weight:600;color:var(--sky-700)}
.match.hot{color:#9ED6F5}
.facts{display:flex;flex-wrap:wrap;gap:6px 15px;margin:12px 0 4px;font-size:13px;font-weight:500;color:var(--ink-2)}
.facts span{display:inline-flex;align-items:center;gap:5px}
.facts svg{width:15px;height:15px;color:var(--muted)}
.next{font-size:12.5px;color:var(--muted);margin-top:6px}
.next b{color:var(--ink);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{padding:3px 9px;border-radius:7px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:11.5px;font-weight:500;color:var(--ink-2)}
.tag.red{background:var(--red-50);border-color:rgba(229,72,77,.35);color:#FF9A9E}
.cfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px;padding-top:11px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.cfoot .low{color:#FF8A8F;font-weight:600}
.joined{display:inline-block;margin-left:7px;padding:2px 8px;border-radius:8px;background:var(--sky-100);color:#BFE3F8;font-size:10.5px;font-weight:600;vertical-align:2px}
.stack{display:flex}
.stack .av{margin-left:-7px;border:2px solid #14171B}
.stack .av:first-child{margin-left:0}
.av{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;color:#fff;font-size:11px;font-weight:600}
.av.lg{width:40px;height:40px;font-size:15px}
.av.more{background:rgba(255,255,255,.10);color:var(--ink-2)}
.cta{margin-top:10px;padding:20px;border-radius:20px;background:rgba(255,255,255,.03);border:1px dashed var(--line-2);text-align:center}
.cta .btn{margin:12px auto 0}
.empty{padding:44px 12px;text-align:center}
.empty b{display:block;font-size:17px;font-weight:600;margin-bottom:6px}
.empty p{color:var(--muted);margin-bottom:18px}

/* ---------- filters ---------- */
.sec{padding:22px 0 6px;border-bottom:1px solid var(--line)}
.sec:last-of-type{border-bottom:0}
.sec h2{margin-bottom:13px}
.sec .sub{margin:-6px 0 12px;font-size:12.5px;color:var(--muted)}
.scale{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}

/* ---------- club detail ---------- */
.cover{margin:0 0 4px}
.cover h1{margin-top:4px}
.cover p{margin-top:6px;color:var(--muted);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:14px 0 6px}
.stat{padding:12px 14px;border-radius:18px}
.stat b{display:block;font-size:21px;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.stat span{font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.block{margin-top:24px}
.block h2{margin-bottom:10px}
.runs{list-style:none;margin:0;padding:0}
.runs li{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:14.5px}
.runs li b{color:var(--ink);font-weight:500}
.runs li span{color:var(--muted)}
.member{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.member b{font-size:14.5px;font-weight:600}
.member .fine{margin-top:1px}
.member.me .av{background:var(--red)!important}
.notice{padding:12px 14px;margin-top:14px;border-radius:14px;background:var(--red-50);border:1px solid rgba(229,72,77,.3);color:#FF9A9E;font-size:13.5px;font-weight:500}

/* ---------- profile ---------- */
.profile-top{display:flex;align-items:center;gap:14px;margin:4px 0 18px}
.profile-top .av{width:58px;height:58px;font-size:21px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-bottom:6px}
.kpi{padding:13px 8px;border-radius:18px;text-align:center}
.kpi b{display:block;font-size:21px;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.kpi span{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.07em}

/* ---------- feedback ---------- */
.rowbtn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin:12px 0 4px;padding:13px 16px;border-radius:18px;text-align:left;cursor:pointer;color:var(--ink);background:var(--sky-100);border:1px solid var(--sky-300)}
.rowbtn b{display:block;font-size:14.5px;font-weight:600}
.rowbtn small{font-size:12px;color:var(--muted)}
.fbcard{margin:12px 0 4px;padding:14px;border-radius:18px;background:var(--sky-100);border:1px solid var(--sky-300)}
.fbcard b{font-size:14.5px;font-weight:600}
.fbcard p{margin:3px 0 12px;font-size:13px;color:var(--ink-2)}
.fbbtns{display:flex;gap:8px}
.fbbtns .btn{min-height:42px;font-size:14px;width:auto;flex:1}
.fbbtns .btn:last-child{flex:.6}
.rate{display:flex;gap:8px}
.rate .chip{flex:1}
.rate .chip span{display:block;text-align:center;padding:13px 0;font-size:17px;font-weight:600;border-radius:14px}

/* ---------- toast ---------- */
#toast{position:absolute;left:20px;right:20px;bottom:calc(var(--tabs) + 32px);padding:13px 16px;border-radius:18px;color:var(--ink);font-size:13.5px;font-weight:500;text-align:center;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:40}
#toast.show{opacity:1;transform:none}
</style>
</head>
<body>
<div id="app">
  <main id="screen" tabindex="-1"></main>
  <nav id="tabs" aria-label="Main"></nav>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<noscript><p style="padding:24px">PaceMates needs JavaScript to run.</p></noscript>

<script src="config.js"></script>
<script src="local-backend.js"></script>
<script>
(function () {
'use strict';

/* =====================================================================
   1. CONFIG
   ===================================================================== */
const STORAGE_KEY = 'pacemates-v2';
const PACE = { min: 240, max: 480, step: 15 };          // seconds per km
const DEFAULT_PACE = 345;

// Approximate neighborhood centres (latitude, longitude), used for distances.
const NEIGHBORHOODS = {
  'Retiro':        [40.4153, -3.6845],
  'Chamberí':      [40.4340, -3.7038],
  'Malasaña':      [40.4256, -3.7040],
  'Salamanca':     [40.4301, -3.6770],
  'Moncloa':       [40.4350, -3.7190],
  'Lavapiés':      [40.4086, -3.7007],
  'Arganzuela':    [40.3960, -3.6990],
  'Casa de Campo': [40.4170, -3.7500],
  'Chamartín':     [40.4600, -3.6770]
};
const HOODS = Object.keys(NEIGHBORHOODS);
const GENDERS = ['Woman', 'Man', 'Non-binary', 'Prefer not to say'];
const NATIONALITIES = ['Spain', 'Germany', 'Italy', 'France', 'United Kingdom', 'United States', 'Portugal', 'Mexico', 'Brazil', 'Netherlands', 'Colombia', 'Other'];
const LANGUAGES = ['English', 'Spanish', 'German', 'French', 'Italian', 'Portuguese'];
const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const TYPES = ['Social', 'Training', 'Trail', 'Intervals', 'Beginner-friendly'];

const TIME_SLOTS = {
  early:   { label: 'Early, before 8:00',  test: h => h < 8 },
  morning: { label: 'Morning, 8:00 to 12:00', test: h => h >= 8 && h < 12 },
  midday:  { label: 'Midday, 12:00 to 17:00', test: h => h >= 12 && h < 17 },
  evening: { label: 'Evening, after 17:00', test: h => h >= 17 }
};
const DISTANCES = {
  short: { label: 'Up to 6 km',    test: k => k <= 6 },
  mid:   { label: '7 to 10 km',    test: k => k >= 7 && k <= 10 },
  long:  { label: '11 km or more', test: k => k >= 11 }
};
const SIZES = {
  small:  { label: 'Small, up to 10',  test: n => n <= 10 },
  medium: { label: 'Medium, 11 to 14', test: n => n >= 11 && n <= 14 },
  large:  { label: 'Large, 15 or more', test: n => n >= 15 }
};
const WITHIN_KM = [2, 4, 6, 8];
const SORTS = { match: 'Best match', soonest: 'Soonest run', nearest: 'Nearest', size: 'Most runners' };
const TABS = [
  { view: 'list',    label: 'Clubs',    icon: 'compass' },
  { view: 'mine',    label: 'My clubs', icon: 'calendar' },
  { view: 'profile', label: 'Profile',  icon: 'user' }
];

/* =====================================================================
   2. UTILITIES
   ===================================================================== */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const fmtPace = sec => Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
const parsePaceStr = s => { const [m, r] = s.split(':').map(Number); return m * 60 + r; };
const firstName = n => String(n).trim().split(/\s+/)[0] || 'Runner';
const displayName = u => {
  const parts = String(u.name).trim().split(/\s+/);
  return parts.length > 1 ? parts[0] + ' ' + parts[parts.length - 1][0].toUpperCase() + '.' : parts[0];
};
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

function haversineKm(a, b) {
  const R = 6371, rad = d => d * Math.PI / 180;
  const dLat = rad(b[0] - a[0]), dLng = rad(b[1] - a[1]);
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
const ICONS = {
  search:   '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  sliders:  '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  user:     '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  compass:  '<circle cx="12" cy="12" r="10"/><path d="M16.2 7.8l-2 6.3-6.4 2.1 2-6.3z"/>',

const defaultFilters = () => ({ pace: null, tol: 30, hoods: [], days: [], times: [], dists: [], types: [], sizes: [], langs: [], within: null, open: false, women: false });

/* ---- server API ---- */
const API_BASE = (window.PACEMATES_API || '').replace(/\/$/, '');
const REMOTE_URL = typeof window.PACEMATES_API === 'string' && /^https?:\/\//.test(window.PACEMATES_API) ? window.PACEMATES_API : null;
const LOCAL_MODE = !REMOTE_URL && !!window.PaceMatesLocal;
const Token = {
  get() { try { return localStorage.getItem('pacemates-token'); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem('pacemates-token', v); } catch (e) { /* ignore */ } },
  clear() { try { localStorage.removeItem('pacemates-token'); } catch (e) { /* ignore */ } }
};
const Prefs = {
  load() { try { return JSON.parse(localStorage.getItem('pacemates-prefs')) || {}; } catch (e) { return {}; } },
  save(s) { try { localStorage.setItem('pacemates-prefs', JSON.stringify({ filters: s.filters, sort: s.sort })); } catch (e) { /* ignore */ } }
};
/* Shared mode: the Google Apps Script web app (see google-script/Code.gs) keeps everything in a Google Sheet.
   One POST with a plain-text body avoids a CORS preflight, which Apps Script does not answer. */
const FB_KEY = 'pacemates-feedback-seen';
const fbSeen = {
  get() { try { return JSON.parse(localStorage.getItem(FB_KEY)) || {}; } catch (e) { return {}; } },
  mark(id) { try { const s = this.get(); s[id] = 1; localStorage.setItem(FB_KEY, JSON.stringify(s)); } catch (e) { /* ignore */ } }
};
async function remoteCall(method, path, body) {
  let res, data;
  try {
    res = await fetch(REMOTE_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ method: method, path: path, body: body || {}, token: Token.get() }), redirect: 'follow' });
    data = await res.json();
  } catch (e) {
    const err = new Error('Can\'t reach PaceMates right now. Check your connection and try again.'); err.status = 0; throw err;
  }
  if (!data.ok) { const err = new Error(data.error || 'Something went wrong.'); err.status = data.status || 500; throw err; }
  return data.data;
}
async function api(method, path, body) {
  if (LOCAL_MODE) return window.PaceMatesLocal.handle(method, path, body, Token.get());
  if (REMOTE_URL) return remoteCall(method, path, body);
  const headers = { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': '1' };
  if (Token.get()) headers.Authorization = 'Bearer ' + Token.get();
  let res;
  try {
    res = await fetch(API_BASE + '/api' + path, { method: method, headers: headers, body: body ? JSON.stringify(body) : undefined });
  } catch (e) {
    const err = new Error('Can\'t reach PaceMates right now. Check your connection and try again.'); err.status = 0; throw err;
  }
  let data = {};
  try { data = await res.json(); } catch (e) { /* empty body */ }
  if (!res.ok) { const err = new Error(data.error || 'Something went wrong.'); err.status = res.status; throw err; }
  return data;
}

const isMember = c => { const u = me(); return !!u && c.members.some(m => m.userId === u.id); };
const spots = c => c.max - c.members.length;
const levelOf = c => c.pace >= 390 ? 'Easy' : c.pace >= 330 ? 'Moderate' : 'Fast';
const clubById = id => state.clubs.find(c => c.id === id);

function distanceFromUser(c) {
  const u = me(); if (!u || !NEIGHBORHOODS[u.hood]) return 0;
  return haversineKm(NEIGHBORHOODS[u.hood], NEIGHBORHOODS[c.hood]);
}
function distanceLabel(c) {
  const km = distanceFromUser(c);
  return km < 0.8 ? 'In your area' : km.toFixed(1) + ' km from you';
}

/* ---- schedule ---- */
function runTimes(c, n) {
  const [h, m] = c.time.split(':').map(Number), now = new Date(), out = [];
  for (let off = 0; off < 60 && out.length < n; off++) {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + off, h, m);
    if (c.days.includes((d.getDay() + 6) % 7) && d > now) out.push(d);
  }
  return out;
}
const nextRun = c => runTimes(c, 1)[0] || null;
function runLabel(d) {
  if (!d) return 'No upcoming run';
  const today = new Date(), t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const diff = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - t0) / 864e5);
  const day = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  const time = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  return (diff === 0 ? 'Today' : diff === 1 ? 'Tomorrow' : day) + ', ' + time;
}
const scheduleText = c => c.days.map(i => DAYS[i]).join(' & ') + ', ' + c.time;

/* ---- matching, filtering, sorting ---- */
function matchScore(c) {
  const u = me(); if (!u) return 0;
  const paceScore = Math.max(0, 1 - Math.abs(c.pace - u.pace) / 90);
  const distScore = Math.max(0, 1 - distanceFromUser(c) / 8);
  const dayScore = u.days && u.days.length ? (c.days.some(d => u.days.includes(d)) ? 1 : 0.3) : 0.65;
  return Math.round(100 * (0.55 * paceScore + 0.3 * distScore + 0.15 * dayScore));
}
function matchesFilters(c, f, q) {
  if (q) {
    const hay = (c.name + ' ' + c.hood + ' ' + c.meet + ' ' + c.types.join(' ')).toLowerCase();
    if (!hay.includes(q.trim().toLowerCase())) return false;
  }
  const hour = +c.time.slice(0, 2);
  if (f.pace != null && Math.abs(c.pace - f.pace) > f.tol) return false;
  if (f.hoods.length && !f.hoods.includes(c.hood)) return false;
  if (f.days.length && !f.days.some(d => c.days.includes(d))) return false;
  if (f.times.length && !f.times.some(k => TIME_SLOTS[k].test(hour))) return false;
  if (f.dists.length && !f.dists.some(k => DISTANCES[k].test(c.dist))) return false;
  if (f.types.length && !f.types.some(t => c.types.includes(t))) return false;
  if (f.sizes.length && !f.sizes.some(k => SIZES[k].test(c.max))) return false;
  if (f.langs.length && !f.langs.some(l => c.langs.includes(l))) return false;
  if (f.within != null && distanceFromUser(c) > f.within) return false;
  if (f.open && spots(c) <= 0) return false;
  if (f.women && !c.women) return false;
  return true;
}
function visibleClubs() {
  const list = state.clubs.filter(c => matchesFilters(c, state.filters, state.q));
  const by = {
    match:   (a, b) => matchScore(b) - matchScore(a),
    soonest: (a, b) => ((nextRun(a) || 1e15) - (nextRun(b) || 1e15)),
    nearest: (a, b) => distanceFromUser(a) - distanceFromUser(b),
    size:    (a, b) => b.members.length - a.members.length
  }[state.sort];
  return list.sort(by);
}
function activeFilters(f) {
  const out = [];
  if (f.pace != null) out.push({ key: 'pace', label: 'Pace ' + fmtPace(f.pace) + ' ±' + f.tol + 's' });
  f.hoods.forEach(v => out.push({ key: 'hoods', value: v, label: v }));
  f.days.forEach(v => out.push({ key: 'days', value: v, label: DAYS[v] }));
  f.times.forEach(v => out.push({ key: 'times', value: v, label: TIME_SLOTS[v].label.split(',')[0] }));
  f.dists.forEach(v => out.push({ key: 'dists', value: v, label: DISTANCES[v].label }));
  f.types.forEach(v => out.push({ key: 'types', value: v, label: v }));
  f.sizes.forEach(v => out.push({ key: 'sizes', value: v, label: SIZES[v].label.split(',')[0] + ' group' }));
  f.langs.forEach(v => out.push({ key: 'langs', value: v, label: v }));
  if (f.within != null) out.push({ key: 'within', label: 'Within ' + f.within + ' km' });
  if (f.open) out.push({ key: 'open', label: 'Open spots' });
  if (f.women) out.push({ key: 'women', label: 'Women only' });
  return out;
}
const filterGroups = f => ['pace', 'hoods', 'days', 'times', 'dists', 'types', 'sizes', 'langs', 'within', 'open', 'women']
  .filter(k => Array.isArray(f[k]) ? f[k].length : (k === 'open' || k === 'women') ? f[k] : f[k] != null).length;

  const members = c.members.map(m => {
    const mine = m.userId === u.id;
    return '<div class="member' + (mine ? ' me' : '') + '">' + avatar(m.name, true) + '<div><b>' + esc(m.name) + (mine ? ' (you)' : '') +
      (m.name === c.founder ? ' <span class="tag" style="margin-left:4px">Founder</span>' : '') + '</b>' +
      '<div class="fine">' + esc(m.nationality) + ' · ' + esc(m.gender) + ' · ' + fmtPace(m.pace) + ' /km</div></div></div>';
  }).join('');
  const founder = c.founderId === u.id;
  const fbCard = (joined && !fbSeen.get()[c.id])
    ? '<div class="fbcard"><b>' + (founder ? 'You started this club' : 'You joined this club') + '</b><p>How was it to find and ' + (founder ? 'create' : 'join') + ' it? Tell us in 30 seconds.</p>' +
      '<div class="fbbtns"><button class="btn btn-red" data-go="feedback" data-id="club:' + c.id + '">Give feedback</button><button class="btn" data-act="fblater" data-id="' + c.id + '">Later</button></div></div>' : '';
  let action;
  if (joined) action = '<button class="btn" data-act="leave" data-id="' + c.id + '">Leave club</button>';
  else if (blocked) action = '<button class="btn" disabled>Women-only club</button>';
  else if (sp <= 0) action = '<button class="btn" disabled>Club is full</button>';
  else action = '<button class="btn btn-red" data-act="join" data-id="' + c.id + '">Join club</button>';
  const routeUrl = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(c.meet + ', ' + c.hood + ', Madrid, Spain');
  const route = '<a class="btn" href="' + routeUrl + '" target="_blank" rel="noopener">' + icon('pin') + 'Route</a>';
  return backBtn(state.back) + '<div class="cover"><h1>' + esc(c.name) + '</h1><p>' + esc(c.hood) + ' · <span style="color:var(--sky-700)">' + matchScore(c) + '% match for you</span></p></div>' + fbCard +
    '<div class="grid"><div class="stat"><b>' + fmtPace(c.pace) + '</b><span>Pace /km</span></div><div class="stat"><b>' + c.dist + ' km</b><span>Distance</span></div>' +
    '<div class="stat"><b>' + levelOf(c) + '</b><span>Level</span></div><div class="stat"><b>' + c.members.length + ' / ' + c.max + '</b><span>Runners</span></div></div>' +
    '<section class="block"><h2>Next runs</h2><ul class="runs">' + runs.map(d => '<li><b>' + runLabel(d) + '</b><span>' + esc(c.meet) + '</span></li>').join('') + '</ul></section>' +
    '<section class="block"><h2>Meeting point</h2><p><b>' + esc(c.meet) + '</b></p><p class="fine" style="margin-top:2px">' + esc(c.hood) + ' · ' + distanceLabel(c) + '</p></section>' +
    '<section class="block"><h2>About</h2><p>' + esc(c.desc) + '</p>' +
    '<div class="tags" style="margin-top:12px">' + c.types.map(t => '<span class="tag">' + esc(t) + '</span>').join('') + (c.women ? '<span class="tag red">Women only</span>' : '') +
    c.langs.map(l => '<span class="tag">' + esc(l) + '</span>').join('') + '</div></section>' +
    (blocked ? '<p class="notice">This club is for women. You can browse it, but you can\'t join.</p>' : '') +
    '<section class="block"><h2>' + plural(c.members.length, 'runner', 'runners') + '</h2>' + members + '</section>' +
    '<div class="bar">' + action + route + '</div>';
}

function vMine() {
  const joined = state.clubs.filter(isMember).sort((a, b) => ((nextRun(a) || 1e15) - (nextRun(b) || 1e15)));
  const body = joined.length
    ? joined.map(clubCard).join('')
    : '<div class="empty"><b>You haven\'t joined a club yet</b><p>Find a group that runs your pace, close to home.</p><button class="btn btn-red" data-go="list">Browse clubs</button></div>';
  return '<header class="head"><h1>My clubs</h1><p class="muted" style="margin-top:6px">' +
    (joined.length ? 'Next up: <b style="color:var(--sky-700)">' + esc(joined[0].name) + '</b>, ' + runLabel(nextRun(joined[0])) : 'Your runs will show up here.') + '</p></header>' +
    body + '<button class="btn" data-go="create" style="margin-top:8px">' + icon('plus') + 'Start a club</button>';
}

function vCreate() {
  const u = me();
  return backBtn('list', 'Clubs') + '<h1>Start a club</h1><p class="muted" style="margin-top:6px">Set a time and place, and runners with a matching pace will find you.</p>' +
    '<form data-form="create" novalidate>' +
    '<label class="f" for="cname">Club name</label><input class="field" id="cname" name="name" placeholder="Retiro Sunday Runners" maxlength="48">' +
    '<label class="f" for="chood">Neighborhood</label><select class="field" id="chood" name="hood">' + opts(HOODS, u.hood, 'Select') + '</select>' +
    '<label class="f" for="cmeet">Meeting point</label><input class="field" id="cmeet" name="meet" placeholder="Puerta de Alcalá" maxlength="60">' +
    '<label class="f">Pace</label><div class="pace-out" id="createOut">' + fmtPace(u.pace) + ' min/km</div>' +
    '<input type="range" name="pace" data-range="createOut" min="' + PACE.min + '" max="' + PACE.max + '" step="' + PACE.step + '" value="' + u.pace + '" aria-label="Pace in seconds per kilometer">' +
    '<label class="f" for="cdist">Distance</label><select class="field" id="cdist" name="dist">' + [3, 5, 6, 8, 10, 12, 15, 18, 21].map(k => '<option value="' + k + '"' + (k === 8 ? ' selected' : '') + '>' + k + ' km</option>').join('') + '</select>' +
    '<label class="f">Days</label>' + chipGroup('days', dayItems(), []) +
    '<label class="f" for="ctime">Start time</label><input class="field" type="time" id="ctime" name="time" value="09:00">' +
    '<label class="f">Style</label>' + chipGroup('types', mapItems(TYPES), ['Social']) +
    '<label class="f">Languages</label>' + chipGroup('langs', mapItems(LANGUAGES), u.langs && u.langs.length ? u.langs : ['English']) +
    '<label class="f" for="cmax">Maximum group size</label><select class="field" id="cmax" name="max">' + [6, 8, 10, 12, 14, 16, 20].map(k => '<option' + (k === 12 ? ' selected' : '') + '>' + k + '</option>').join('') + '</select>' +
    '<label class="switch" style="margin-top:8px"><span>Women-only club</span><input type="checkbox" name="women"' + (u.gender === 'Man' ? ' disabled' : '') + '></label>' +
    '<label class="f" for="cdesc">About the club</label><textarea class="field" id="cdesc" name="desc" maxlength="280" placeholder="What is the route like? Who is it for?"></textarea>' +
    '<div class="err" id="err" role="alert"></div>' +
    '<button class="btn btn-red" type="submit">Start club</button><div style="height:20px"></div></form>';
}

function vProfile() {
  const u = me(), joined = state.clubs.filter(isMember), founded = state.clubs.filter(c => c.founderId === u.id).length;
  return '<div class="profile-top">' + avatar(u.name, true) + '<div><h1 style="font-size:22px">' + esc(u.name) + '</h1><p class="muted">' + esc(u.hood) + ' · ' + fmtPace(u.pace) + ' min/km</p></div></div>' +
    '<div class="kpis"><div class="kpi"><b>' + joined.length + '</b><span>Clubs</span></div><div class="kpi"><b>' + fmtPace(u.pace) + '</b><span>Pace /km</span></div><div class="kpi"><b>' + founded + '</b><span>Founded</span></div></div>' +
    '<button class="rowbtn" data-go="feedback"><span><b>Give feedback</b><small>Takes 30 seconds</small></span>' + icon('next') + '</button>' +
    '<form data-form="profile" novalidate>' +
    '<label class="f" for="pname">Full name</label><input class="field" id="pname" name="name" value="' + esc(u.name) + '" autocomplete="name">' +
    '<label class="f" for="phood">Neighborhood</label><select class="field" id="phood" name="hood">' + opts(HOODS, u.hood, 'Select') + '</select>' +
    '<label class="f" for="ppace">Usual pace</label><select class="field" id="ppace" name="pace">' + paceOpts(u.pace) + '</select>' +
    '<label class="f">Days you can run</label>' + chipGroup('days', dayItems(), u.days || []) +
    '<label class="f">Languages</label>' + chipGroup('langs', mapItems(LANGUAGES), u.langs || []) +
    '<div class="err" id="err" role="alert"></div>' +
    '<button class="btn btn-red" type="submit">Save changes</button></form>' +
    '<div style="margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:4px">' +
    '<button class="link" data-act="logout">Log out</button>' +
    '<button class="link danger" data-act="deleteaccount">Delete my account</button>' +
    '<p class="fine" style="text-align:center;max-width:300px">' + (LOCAL_MODE ? 'Your profile is saved in this browser only. Deleting your account removes it.' : 'Your profile is stored in the PaceMates team database. Deleting your account removes it.') + '</p></div>';
}

function vFeedback() {
  const ctx = String(state.param || ''), clubId = ctx.indexOf('club:') === 0 ? ctx.slice(5) : '', c = clubId ? clubById(clubId) : null;
  const back = c ? '<button class="back" data-go="club" data-id="' + c.id + '">' + icon('back') + 'Back</button>' : backBtn('profile');
  return back + '<h1>Give feedback</h1><p class="muted" style="margin-top:6px">' + (c ? 'About finding and joining ' + esc(c.name) + '. ' : 'Tell us what works and what does not. ') + 'It takes 30 seconds.</p>' +
    '<form data-form="feedback" novalidate><input type="hidden" name="clubId" value="' + esc(clubId) + '">' +
    '<label class="f">How likely are you to use PaceMates?</label>' +
    '<div class="rate">' + [1, 2, 3, 4, 5].map(n => '<label class="chip"><input type="radio" name="rating" value="' + n + '"><span>' + n + '</span></label>').join('') + '</div>' +
    '<div class="row fine" style="margin-top:6px"><span>Not likely</span><span>Very likely</span></div>' +
    '<label class="f" for="hard">What was hard or unclear?</label><textarea class="field" id="hard" name="hard" maxlength="500" placeholder="For example: I could not find the filter"></textarea>' +
    '<label class="f" for="missing">What is missing for you?</label><textarea class="field" id="missing" name="missing" maxlength="500" placeholder="For example: a map of the meeting point"></textarea>' +
    '<div class="err" id="err" role="alert"></div><button class="btn btn-red" type="submit">Send feedback</button><div style="height:20px"></div></form>';
}

const VIEWS = { feedback: vFeedback, loading: vLoading, offline: vOffline, welcome: vWelcome, signup: vSignup, login: vLogin, list: vList, filters: vFilters, club: vClub, mine: vMine, create: vCreate, profile: vProfile };
const TITLES = { feedback: 'Feedback · PaceMates', loading: 'PaceMates', offline: 'PaceMates', welcome: 'PaceMates: find your running club', signup: 'Create account · PaceMates', login: 'Log in · PaceMates', list: 'Clubs · PaceMates', filters: 'Filters · PaceMates', club: 'Club · PaceMates', mine: 'My clubs · PaceMates', create: 'Start a club · PaceMates', profile: 'Profile · PaceMates' };
const PUBLIC_VIEWS = ['welcome', 'login', 'signup'];

/* =====================================================================
   7. RENDERING AND NAVIGATION
   ===================================================================== */
const appEl = document.getElementById('app');
const screenEl = document.getElementById('screen');
const tabsEl = document.getElementById('tabs');
const toastEl = document.getElementById('toast');
let toastTimer = null;

function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
}
function renderTabs() {
  const showTabs = TABS.some(t => t.view === state.view);
  appEl.classList.toggle('has-tabs', showTabs);
  if (!showTabs) return;
  tabsEl.innerHTML = TABS.map(t =>
    '<button data-go="' + t.view + '"' + (state.view === t.view ? ' aria-current="page"' : '') + '>' + icon(t.icon) + t.label + '</button>').join('');
}
function render(keepScroll) {
  const y = screenEl.scrollTop;
  screenEl.innerHTML = VIEWS[state.view]();
  screenEl.scrollTop = keepScroll ? y : 0;
  document.title = TITLES[state.view];
  renderTabs();
  if (state.view === 'filters') previewFilterCount();
}
function go(view, param) {
  if (!me() && !PUBLIC_VIEWS.includes(view)) view = 'welcome';
  if (view === 'club') state.back = TABS.some(t => t.view === state.view) ? state.view : state.back;
  state.view = view; state.param = param || null;
  render(false);
  if (['list', 'mine', 'club'].includes(view)) refreshClubs();
}
function setErr(msg, field) {
  const e = document.getElementById('err'); if (e) e.textContent = msg;
  screenEl.querySelectorAll('[aria-invalid]').forEach(el => el.removeAttribute('aria-invalid'));
  const el = field && screenEl.querySelector('[name="' + field + '"]');
  if (el) { el.setAttribute('aria-invalid', 'true'); el.focus(); }
  return false;
}
function updateList() {
  const list = visibleClubs();
  const box = document.getElementById('clubList'), count = document.getElementById('resultCount');
  if (box) box.innerHTML = listBody(list);
  if (count) count.textContent = plural(list.length, 'club', 'clubs');
}

/* =====================================================================
   8. FORMS AND ACTIONS
   ===================================================================== */
const formData = form => {
  const d = {}, fd = new FormData(form);
  fd.forEach((v, k) => { d[k] = k in d ? [].concat(d[k], v) : v; });
  ['days', 'langs', 'types', 'hoods', 'times', 'dists', 'sizes'].forEach(k => { if (k in d && !Array.isArray(d[k])) d[k] = [d[k]]; });
  return d;
};
const list = v => v == null ? [] : Array.isArray(v) ? v : [v];

function readFilters(d) {
  return {
    pace: 'anypace' in d || d.pace == null ? null : +d.pace,
    tol: +(d.tol || 30),
    hoods: list(d.hoods), days: list(d.days).map(Number), times: list(d.times), dists: list(d.dists),
    types: list(d.types), sizes: list(d.sizes), langs: list(d.langs),
    within: d.within === '' || d.within == null ? null : +d.within,
    open: 'open' in d, women: 'women' in d
  };
}
function previewFilterCount() {
  const form = screenEl.querySelector('form[data-form="filters"]'), btn = document.getElementById('applyBtn');
  if (!form || !btn) return;
  const f = readFilters(formData(form));
  const n = state.clubs.filter(c => matchesFilters(c, f, state.q)).length;
  btn.textContent = n ? 'Show ' + plural(n, 'club', 'clubs') : 'No clubs match';
  btn.disabled = n === 0;
}

function authBody(d) {
  return { name: (d.name || '').trim(), password: d.password, gender: d.gender, nationality: d.nationality,
    hood: d.hood, pace: +d.pace, days: list(d.days).map(Number), langs: list(d.langs) };
}
async function startSession(r, message) {
  Token.set(r.token); state.user = r.user; state.filters = defaultFilters(); state.q = '';
  persist(); await loadClubs(); go('list'); toast(message);
}
async function doSignup(d) {
  const b = authBody(d);
  if (b.name.split(/\s+/).length < 2) return setErr('Enter your first and last name.', 'name');
  if ((d.password || '').length < 4) return setErr('Use a password with at least 4 characters.', 'password');
  if (!d.gender) return setErr('Select your gender.', 'gender');
  if (!d.nationality) return setErr('Select your nationality.', 'nationality');
  if (!d.hood) return setErr('Select your neighborhood.', 'hood');
  if (!d.pace) return setErr('Select your usual pace.', 'pace');
  await startSession(await api('POST', '/signup', b), 'Welcome to PaceMates, ' + firstName(b.name));
}
async function doLogin(d) {
  const r = await api('POST', '/login', { name: (d.name || '').trim(), password: d.password || '' });
  await startSession(r, 'Welcome back, ' + firstName(r.user.name));
}
async function doProfile(d) {
  const b = authBody(d);
  if (b.name.split(/\s+/).length < 2) return setErr('Enter your first and last name.', 'name');
  if (!d.hood) return setErr('Select your neighborhood.', 'hood');
  if (!d.pace) return setErr('Select your usual pace.', 'pace');
  state.user = (await api('PUT', '/me', b)).user;
  await loadClubs(); render(true); toast('Profile saved');
}
async function doFeedback(d) {
  if (!d.rating) return setErr('Pick a rating from 1 to 5.');
  const clubId = d.clubId || '';
  await api('POST', '/feedback', { rating: +d.rating, hard: (d.hard || '').trim(), missing: (d.missing || '').trim(), where: clubId ? 'club' : 'profile', clubId: clubId });
  if (clubId) fbSeen.mark(clubId);
  toast('Thanks, your feedback was sent'); go(clubId ? 'club' : 'profile', clubId || null);
}
async function doCreate(d) {
  const u = me(), days = list(d.days).map(Number);
  if ((d.name || '').trim().length < 3) return setErr('Give your club a name.', 'name');
  if (!d.hood) return setErr('Select a neighborhood.', 'hood');
  if (!(d.meet || '').trim()) return setErr('Add a meeting point.', 'meet');
  if (!days.length) return setErr('Select at least one day.');
  if (!d.time) return setErr('Pick a start time.', 'time');
  if (!list(d.langs).length) return setErr('Select at least one language.');
  const r = await api('POST', '/clubs', { name: d.name.trim(), hood: d.hood, meet: d.meet.trim(), pace: +d.pace, dist: +d.dist, days: days, time: d.time,
    types: list(d.types).length ? list(d.types) : ['Social'], langs: list(d.langs), max: +d.max, women: 'women' in d && u.gender !== 'Man', desc: (d.desc || '').trim() });
  state.clubs.unshift(r.club); go('club', r.club.id); toast('Club created');
}

async function refreshClubs() {
  if (!me() || !['list', 'mine', 'club'].includes(state.view)) return;
  try {
    const before = JSON.stringify(state.clubs);
    await loadClubs();
    if (JSON.stringify(state.clubs) === before) return;
    if (state.view === 'list') updateList(); else render(true);
  } catch (e) { if (e.status === 401) sessionExpired(); }
}
function sessionExpired() {
  Token.clear(); state.user = null; state.clubs = []; go('welcome'); toast('Please log in again.');
}

async function act(name, el) {
  let oldHtml = null;
  try {
    if (name === 'logout') { Token.clear(); state.user = null; state.clubs = []; await loadStats().catch(() => {}); go('welcome'); }
    else if (name === 'retry') { boot(); }
    else if (name === 'fblater') { fbSeen.mark(el.dataset.id); render(true); }
    else if (name === 'deleteaccount') {
      if (window.confirm('Delete your account and your runner profile? Clubs you started stay, but you are removed from every club.')) {
        await api('DELETE', '/me'); Token.clear(); state.user = null; state.clubs = []; await loadStats().catch(() => {}); go('welcome'); toast('Account deleted');
      }
    }
    else if (name === 'resetfilters') { state.filters = defaultFilters(); persist(); render(true); }
    else if (name === 'clearfilters') { state.filters = defaultFilters(); state.q = ''; persist(); render(true); }
    else if (name === 'unfilter') {
      const key = el.dataset.key, val = el.dataset.value, f = state.filters;
      if (Array.isArray(f[key])) f[key] = f[key].filter(x => String(x) !== val);
      else if (key === 'open' || key === 'women') f[key] = false;
      else f[key] = null;
      persist(); render(true);
    }
    else if (name === 'join' || name === 'leave') {
      el.disabled = true; oldHtml = el.innerHTML; el.textContent = 'Please wait…';
      const r = await api('POST', '/clubs/' + el.dataset.id + '/' + name);
      state.clubs = state.clubs.map(c => c.id === r.club.id ? r.club : c);
      toast(name === 'join' ? 'You joined ' + r.club.name : 'You left ' + r.club.name); render(true);
    }
  } catch (e) {
    if (e.status === 401) sessionExpired(); else { toast(e.message); if (el) { el.disabled = false; if (oldHtml !== null) el.innerHTML = oldHtml; } }
  }
}

/* =====================================================================
   9. EVENTS
   ===================================================================== */
appEl.addEventListener('click', e => {
  const el = e.target.closest('[data-go],[data-act]'); if (!el) return;
  if (el.dataset.go) go(el.dataset.go, el.dataset.id); else act(el.dataset.act, el);
});
appEl.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button]')) { e.preventDefault(); e.target.click(); }
});
appEl.addEventListener('submit', async e => {
  e.preventDefault();
  const form = e.target, d = formData(form), kind = form.dataset.form, btn = form.querySelector('[type=submit]');
  if (kind === 'filters') { state.filters = readFilters(d); persist(); go('list'); return; }
  const run = { signup: doSignup, login: doLogin, profile: doProfile, create: doCreate, feedback: doFeedback }[kind];
  if (!run || (btn && btn.disabled)) return;
  const label = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Please wait…'; }
  try { await run(d); }
  catch (err) { if (err.status === 401 && kind !== 'login') sessionExpired(); else setErr(err.message); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = label; } }
});
appEl.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { state.q = t.value; updateList(); return; }
  if (t.dataset && t.dataset.range) {
    const out = document.getElementById(t.dataset.range);
    if (out) out.textContent = fmtPace(+t.value) + ' min/km';
  }
});
appEl.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'sort') { state.sort = t.value; persist(); updateList(); return; }
  if (t.hasAttribute('data-anypace')) {
    const range = document.getElementById('paceRange'), out = document.getElementById('paceOut');
    range.disabled = t.checked;
    out.textContent = t.checked ? 'Any pace' : fmtPace(+range.value) + ' min/km';
  }
  if (t.closest('form[data-form="filters"]')) previewFilterCount();
});
appEl.addEventListener('input', e => { if (e.target.closest('form[data-form="filters"]')) previewFilterCount(); });

async function boot() {
  state.view = 'loading'; render(false);
  try {
    if (Token.get()) { state.user = (await api('GET', '/me')).user; await loadClubs(); state.view = 'list'; }
    else { await loadStats(); state.view = 'welcome'; }
  } catch (e) {
    if (e.status === 401) { Token.clear(); state.user = null; await loadStats().catch(() => {}); state.view = 'welcome'; }
    else state.view = 'offline';
  }
  render(false);
}
setInterval(refreshClubs, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshClubs(); });
boot();
})();
</script>
</body>
</html>
