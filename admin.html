<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PaceMates Team Dashboard</title>
<style>
:root{--sky-50:#F2F9FE;--sky-100:#E3F2FC;--sky-200:#C2E3F8;--sky-300:#93CDF2;--sky-400:#5DB6EC;--sky-600:#1B84C8;--sky-700:#146AA4;--ink:#0E2A44;--ink-2:#3F566E;--muted:#6B7F95;--line:#DAE7F2;--bg:#EEF5FB;--red:#D32F43;--red-dark:#B82337;--red-50:#FDECEE;--shadow:0 1px 2px rgba(14,42,68,.06),0 6px 16px rgba(14,42,68,.07)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky-400);outline-offset:2px}
header{background:linear-gradient(120deg,var(--sky-400),var(--sky-200));padding:22px 28px}
.wrap{max-width:1180px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{display:flex}.logo i{display:block;width:30px;height:30px;border-radius:50%}.logo i:first-child{background:#fff}.logo i:last-child{background:var(--red);margin-left:-11px}
h1{margin:0;font-size:22px;letter-spacing:-.3px}
.sub{margin:2px 0 0;font-size:13px;color:var(--ink-2);font-weight:600}
main{padding:24px 28px 60px}
.btn{border:2px solid var(--sky-700);background:#fff;color:var(--sky-700);font-weight:700;border-radius:999px;padding:8px 18px;cursor:pointer}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{background:var(--red-dark)}
.btn.sm{padding:4px 12px;font-size:13px;border-width:1.5px}
.btn.danger{border-color:var(--red);color:var(--red)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.card b{display:block;font-size:30px;letter-spacing:-.5px;color:var(--sky-700)}
.card span{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:22px;overflow:hidden}
.panel h2{margin:0;padding:16px 20px;font-size:15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.panel h2 small{font-weight:600;color:var(--muted)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:11px 20px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:var(--sky-50)}
tr:last-child td{border-bottom:0}
td b{color:var(--ink)}
.muted{color:var(--muted)}
.tag{display:inline-block;margin:0 4px 4px 0;padding:2px 8px;border-radius:6px;background:var(--sky-50);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink-2)}
.new{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:700}
.two{display:grid;grid-template-columns:2fr 1fr;gap:22px}
@media(max-width:900px){.two{grid-template-columns:1fr}}
ul.feed{list-style:none;margin:0;padding:6px 20px 14px}
ul.feed li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
ul.feed li:last-child{border-bottom:0}
.empty{padding:26px 20px;color:var(--muted)}
.bars{padding:10px 20px 16px}
.bar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.bar span:first-child{width:104px;color:var(--ink-2);font-weight:600}
.bar i{display:block;height:10px;border-radius:5px;background:var(--sky-400)}
.bar em{font-style:normal;color:var(--muted);font-weight:700}
.login{max-width:380px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow)}
.login input{width:100%;margin:14px 0 8px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);font-size:16px}
.login input:focus{outline:none;border-color:var(--sky-400);box-shadow:0 0 0 3px var(--sky-200)}
.err{min-height:20px;color:var(--red);font-weight:700;font-size:14px;margin-bottom:10px}
.banner{margin:0 0 18px;padding:12px 16px;border-radius:12px;background:var(--red-50);border:1px solid #F6C7CD;color:var(--red-dark);font-size:14px}
.path{font-size:12px;color:var(--ink-2);font-weight:600;word-break:break-all}
</style>
</head>
<body>
<div id="root"></div>
<script src="config.js"></script>
<script src="local-backend.js"></script>
<script>
(function () {
'use strict';
const API = (window.PACEMATES_API || '').replace(/\/$/, '');
const LOCAL = window.PACEMATES_API === null && !!window.PaceMatesLocal;
const KEY = 'pacemates-admin-key';
const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const root = document.getElementById('root');
let seen = null, timer = null;

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const pace = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
const getKey = () => { try { return sessionStorage.getItem(KEY); } catch (e) { return null; } };
const setKey = v => { try { v ? sessionStorage.setItem(KEY, v) : sessionStorage.removeItem(KEY); } catch (e) { /* ignore */ } };
const when = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ', ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); };

async function call(method, path) {
  if (LOCAL) return window.PaceMatesLocal.handle(method, '/admin' + path, null, null);
  const res = await fetch(API + '/api/admin' + path, { method: method, headers: { 'X-Admin-Key': getKey() || '', 'ngrok-skip-browser-warning': '1' } });
  let data = {}; try { data = await res.json(); } catch (e) { /* ignore */ }
  if (!res.ok) { const e = new Error(data.error || 'Request failed'); e.status = res.status; throw e; }
  return data;
}

function loginView(msg) {
  clearInterval(timer);
  root.innerHTML = '<form class="login" id="f"><div class="brand"><div class="logo"><i></i><i></i></div><h1>Team dashboard</h1></div>' +
    '<p class="sub" style="margin-top:10px">Enter the admin key to see PaceMates users and clubs.</p>' +
    '<input type="password" id="k" placeholder="Admin key" autocomplete="off" aria-label="Admin key">' +
    '<div class="err" role="alert">' + esc(msg || '') + '</div><button class="btn red" style="width:100%;padding:12px">Open dashboard</button></form>';
  document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); setKey(document.getElementById('k').value.trim()); load(true); });
}

function bars(obj) {
  const keys = Object.keys(obj), max = Math.max.apply(null, keys.map(k => obj[k]).concat(1));
  return keys.length ? '<div class="bars">' + keys.sort((a, b) => obj[b] - obj[a]).map(k =>
    '<div class="bar"><span>' + esc(k) + '</span><i style="width:' + Math.round(obj[k] / max * 160) + 'px"></i><em>' + obj[k] + '</em></div>').join('') + '</div>' : '<p class="empty">No data yet.</p>';
}

function dashboard(d) {
  const s = d.stats, fresh = id => seen && !seen.has(id);
  root.innerHTML =
    '<header><div class="wrap top"><div class="brand"><div class="logo"><i></i><i></i></div><div><h1>PaceMates team dashboard</h1>' +
    '<p class="sub">Everything people do in the app, refreshed every 8 seconds.</p></div></div>' +
    (LOCAL ? '' : '<button class="btn" id="out">Lock</button>') + '</div></header>' +
    '<main><div class="wrap">' +
    (LOCAL ? '<p class="banner"><b>Local mode.</b> This page shows the made-up sample runners and clubs plus anyone who signs up in this browser. It is not connected to a server or to the Obsidian vault.</p>' : '') +
    '<div class="cards"><div class="card"><b>' + s.users + '</b><span>Runners</span></div><div class="card"><b>' + s.clubs + '</b><span>Clubs</span></div>' +
    '<div class="card"><b>' + s.memberships + '</b><span>Club memberships</span></div><div class="card"><b>' + (s.avgPace ? pace(s.avgPace) : '–') + '</b><span>Average pace /km</span></div></div>' +
    '<p class="path" style="margin:-6px 0 18px">' + (LOCAL ? 'Data source: ' : 'Stored as Markdown files in the Obsidian vault: ') + esc(d.dataDir) + '</p>' +
    '<div class="two"><div>' +
    '<section class="panel"><h2>Runners <small>' + d.users.length + '</small></h2>' + (d.users.length ? '<div class="scroll"><table><thead><tr><th>Name</th><th>Neighborhood</th><th>Pace</th><th>Days</th><th>Clubs</th><th>Signed up</th><th></th></tr></thead><tbody>' +
    d.users.map(u => '<tr><td><b>' + esc(u.name) + '</b>' + (fresh(u.id) ? '<span class="new">new</span>' : '') + '<br><span class="muted">' + esc(u.nationality) + ' · ' + esc(u.gender) + '</span></td>' +
      '<td>' + esc(u.hood) + '</td><td>' + pace(u.pace) + '</td><td>' + (u.days.length ? u.days.map(i => DAYS[i]).join(', ') : '<span class="muted">any</span>') + '</td>' +
      '<td>' + (u.clubs.length ? u.clubs.map(c => '<span class="tag">' + esc(c) + '</span>').join('') : '<span class="muted">none</span>') + '</td><td class="muted">' + when(u.created) + '</td>' +
      '<td><button class="btn sm danger" data-del="users" data-id="' + u.id + '" data-name="' + esc(u.name) + '">Remove</button></td></tr>').join('') + '</tbody></table></div>' : '<p class="empty">No runners yet. Share the app link and the first sign-ups show up here.</p>') + '</section>' +
    '<section class="panel"><h2>Clubs <small>' + d.clubs.length + '</small></h2>' + (d.clubs.length ? '<div class="scroll"><table><thead><tr><th>Club</th><th>Neighborhood</th><th>Pace</th><th>Schedule</th><th>Runners</th><th>Founder</th><th></th></tr></thead><tbody>' +
    d.clubs.map(c => '<tr><td><b>' + esc(c.name) + '</b>' + (fresh(c.id) ? '<span class="new">new</span>' : '') + '<br><span class="muted">' + esc(c.meet) + '</span></td><td>' + esc(c.hood) + '</td><td>' + pace(c.pace) + '</td>' +
      '<td>' + c.days.map(i => DAYS[i]).join(' & ') + ', ' + esc(c.time) + '<br><span class="muted">' + c.dist + ' km</span></td><td>' + c.members.length + ' / ' + c.max + '</td><td>' + esc(c.founder) + '</td>' +
      '<td><button class="btn sm danger" data-del="clubs" data-id="' + c.id + '" data-name="' + esc(c.name) + '">Remove</button></td></tr>').join('') + '</tbody></table></div>' : '<p class="empty">No clubs yet.</p>') + '</section>' +
    '</div><div>' +
    '<section class="panel"><h2>Activity</h2>' + (d.activity.length ? '<ul class="feed">' + d.activity.map(a => '<li>' + esc(a) + '</li>').join('') + '</ul>' : '<p class="empty">Nothing yet.</p>') + '</section>' +
    '<section class="panel"><h2>Runners by neighborhood</h2>' + bars(s.byHood) + '</section>' +
    '<section class="panel"><h2>Runners by gender</h2>' + bars(s.byGender) + '</section>' +
    '</div></div></div></main>';
  seen = new Set(d.users.map(u => u.id).concat(d.clubs.map(c => c.id)));
  const out = document.getElementById('out');
  if (out) out.addEventListener('click', () => { setKey(null); seen = null; loginView(); });
  root.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
    if (!window.confirm('Remove "' + b.dataset.name + '"? This deletes the file from the vault.')) return;
    try { await call('DELETE', '/' + b.dataset.del + '/' + b.dataset.id); load(false); } catch (e) { window.alert(e.message); }
  }));
}

const SHARED = typeof window.PACEMATES_API === 'string' && /^https?:\/\//.test(window.PACEMATES_API);
function sharedView() {
  const link = window.PACEMATES_SHEET;
  root.innerHTML = '<header><div class="wrap top"><div class="brand"><div class="logo"><i></i><i></i></div><div><h1>PaceMates team dashboard</h1>' +
    '<p class="sub">Shared mode</p></div></div></div></header><main><div class="wrap"><section class="panel"><h2>Where the data is</h2>' +
    '<p class="empty" style="color:var(--ink)">All runners, clubs and activity are stored in a Google Sheet (tabs <b>Users</b>, <b>Clubs</b>, <b>Log</b>). The sheet is the team view: every sign-up and every new club appears there as a new row, and you can read, correct or delete rows directly.</p>' +
    (link ? '<p class="empty"><a class="btn red" style="display:inline-block;text-decoration:none" href="' + esc(link) + '" target="_blank" rel="noopener">Open the Google Sheet</a></p>' : '<p class="empty">Ask the project owner for the link to the sheet.</p>') +
    '</section></div></main>';
}
async function load(first) {
  if (SHARED) return sharedView();
  if (!LOCAL && !getKey()) return loginView();
  try {
    const d = await call('GET', '/overview');
    if (first) seen = null;
    dashboard(d);
    clearInterval(timer); timer = setInterval(() => load(false), 8000);
  } catch (e) {
    if (e.status === 401) { setKey(null); loginView('That key is not right.'); }
    else if (first || !root.querySelector('main')) loginView('Can\'t reach the server.');
  }
}
load(true);
})();
</script>
</body>
</html>
